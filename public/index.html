<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mundial 2026</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <h1>Mundial 2026</h1>
      </div>
      <div class="hero-actions">
        <button id="openLobatoBtn" class="mystery-button" type="button" aria-label="Sorpresa">?</button>
        <button id="openGameBtn" type="button">Tirar penalti</button>
        <button id="refreshBtn">Actualizar ahora</button>
        <span id="statusBadge" class="badge">Cargando…</span>
      </div>
    </header>

    <section id="alerts" class="alerts"></section>

    <section class="grid kpis" id="funFacts"></section>

    <section class="insights-grid">
      <article class="card chart-card">
        <div class="card-header">
          <div>
            <h2>Evolución</h2>
          </div>
        </div>
        <div id="historyChart" class="history-chart"></div>
      </article>

      <article class="card medals-card">
        <div class="card-header">
          <div>
            <h2>Medallas y exactos</h2>
          </div>
        </div>
        <div id="medalsRanking" class="medals-ranking"></div>
      </article>
    </section>

    <main class="layout">
      <section class="card leaderboard-card">
        <div class="card-header">
          <div>
            <h2>Clasificación</h2>
          </div>
          <input id="searchInput" type="search" placeholder="Buscar participante…">
        </div>
        <div class="table-wrap">
          <table id="leaderboardTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Participante</th>
                <th>Total</th>
                <th>Exactos</th>
                <th>Grupos</th>
                <th>1/16</th>
                <th>1/8</th>
                <th>1/4</th>
                <th>Semis</th>
                <th>Honor</th>
                <th>Premios</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <aside class="card details-card">
        <div class="card-header">
          <div>
            <h2>Detalle del jugador</h2>
            <p id="detailSubtitle"></p>
          </div>
        </div>
        <div id="participantDetails" class="details"></div>
      </aside>
    </main>

    <section class="grid two-cols">
      <article class="card">
        <div class="card-header">
          <div>
            <h2>Partidos</h2>
          </div>
        </div>
        <div id="matchesList" class="match-list"></div>
      </article>

      <article class="card">
        <div class="card-header">
          <div>
            <h2>Cuadro y clasificados</h2>
          </div>
        </div>
        <div id="qualifiedList" class="qualified-list"></div>
      </article>
    </section>

    <section class="card groups-section">
      <div class="card-header">
        <div>
          <h2>Grupos</h2>
        </div>
        <select id="groupSelect" aria-label="Seleccionar grupo"></select>
      </div>
      <div id="groupsGrid" class="groups-grid"></div>
    </section>
  </div>

  <div id="predictionsModal" class="modal" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="predictionsTitle">
      <div class="modal-header">
        <div>
          <h2 id="predictionsTitle">Predicciones</h2>
          <p id="predictionsSubtitle"></p>
        </div>
        <button id="closePredictionsBtn" class="icon-button" type="button">Cerrar</button>
      </div>
      <div id="predictionsContent"></div>
    </div>
  </div>

  <div id="gameModal" class="modal" aria-hidden="true">
    <div class="modal-panel game-panel" role="dialog" aria-modal="true" aria-labelledby="gameTitle">
      <div class="modal-header">
        <div>
          <h2 id="gameTitle">Tirar penalti</h2>
          <p id="gameSubtitle">Goles: 0 · Tiros: 0 · Racha: 0</p>
        </div>
        <button id="closeGameBtn" class="icon-button" type="button">Cerrar</button>
      </div>
      <div class="game-shell">
        <canvas id="penaltyGame" width="960" height="620" aria-label="Minijuego de penaltis"></canvas>
        <div id="gameResult" class="game-result">A puerta</div>
      </div>
    </div>
  </div>

  <div id="lobatoModal" class="modal lobato-modal" aria-hidden="true">
    <div class="modal-panel lobato-panel" role="dialog" aria-modal="true" aria-labelledby="lobatoTitle">
      <div class="modal-header">
        <div>
          <h2 id="lobatoTitle">A ver qué ha pasado aquí</h2>
        </div>
        <button id="closeLobatoBtn" class="icon-button" type="button">Cerrar</button>
      </div>
      <div class="lobato-stage">
        <img src="images/lobato.jpeg" alt="Lobato" loading="lazy">
      </div>
    </div>
  </div>

  <script src="static-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
